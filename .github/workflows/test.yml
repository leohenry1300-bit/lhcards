name: tests
on:
  push:
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: index.html must match the sources (run python3 build.py and commit)
        run: |
          cp index.html /tmp/committed.html
          python3 build.py > /dev/null
          if ! diff <(grep -v 'name="app-build"' /tmp/committed.html) <(grep -v 'name="app-build"' index.html) > /dev/null; then
            echo "index.html is not up to date with src/: run 'python3 build.py' and commit it"; exit 1
          fi
      - name: Install the browser
        working-directory: tests
        run: npm install && npx playwright install --with-deps chromium
      - name: End-to-end checks
        working-directory: tests
        run: npm test
